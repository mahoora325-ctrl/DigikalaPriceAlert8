plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.example.digikalapricealert'
    compileSdk 34

    defaultConfig {
        applicationId "ir.example.digikalapricealert"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "2.5"
    }

    // کلید امضای دیباگ: فقط برای تست روی گوشی خودتان (build نوع debug).
    // کلید امضای release: یک کلید واقعی و ثابت (نه کلید دیباگ اندروید) که
    // برای انتشار در استورهایی مثل مایکت/کافه‌بازار لازم است. چون این کلید هم
    // ثابت است (در app/release.keystore ذخیره شده)، نسخه‌های بعدی هم در استور
    // به‌عنوان «آپدیت» شناسایی می‌شوند.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.keystore')
            storePassword 'Dka!Pr1ce2026'
            keyAlias 'pricealertreleasekey'
            keyPassword 'Dka!Pr1ce2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
